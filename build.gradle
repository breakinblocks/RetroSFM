plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.27'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        arguments.addAll '--width', client_width, '--height', client_height
    }
    server {
        arguments.add '--nogui'
    }
    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "maven.modrinth:super-factory-manager:${sfm_modrinth_version_id}"
}

publishMods {
    file = jar.archiveFile
    displayName = "${mod_name} ${mod_version} for MC ${minecraft_version}"
    version = project.version
    type = STABLE
    modLoaders.add('neoforge')
    changelog = providers.provider {
        var file = rootProject.file('CHANGELOG.md')
        file.exists() ? file.getText('UTF-8') : "See https://github.com/breakinblocks/RetroSFM/blob/main/CHANGELOG.md"
    }

    curseforge {
        projectId = curseforge_project_id
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = false
        requires { slug = 'super-factory-manager' }
    }

    modrinth {
        projectId = modrinth_project_id
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires { slug = 'super-factory-manager' }
    }
}

processResources {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            sfm_version_range      : sfm_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
